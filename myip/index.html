<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alamat IP Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: satu kolom sempit rata kiri, IP besar di atas, detail membuka ke bawah. */
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --fg: #14201c;
    --muted: #5d6b66;
    --line: #dbe2df;
    --accent: #0f766e;
    --accent-soft: #d9efec;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1513;
      --surface: #151e1b;
      --fg: #e7efec;
      --muted: #8fa099;
      --line: #25322e;
      --accent: #4fd1c0;
      --accent-soft: #163330;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1513;
    --surface: #151e1b;
    --fg: #e7efec;
    --muted: #8fa099;
    --line: #25322e;
    --accent: #4fd1c0;
    --accent-soft: #163330;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 12vh 64px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  main { width: 100%; max-width: 560px; margin: 0 auto; }

  .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .ip-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ip {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: clamp(28px, 8vw, 48px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .copy {
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .copy:hover { filter: brightness(0.97); }

  .loc { margin: 16px 0 0; font-size: 20px; color: var(--fg); }
  .loc small { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }

  .skeleton { color: transparent; background: var(--line); border-radius: 6px; width: 60%; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  .more-btn {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-weight: 500;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .more-btn svg { transition: transform 0.35s ease; }
  .more-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .more-btn:disabled { opacity: 0.4; cursor: default; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.45s ease;
  }
  .panel.open { grid-template-rows: 1fr; }
  .panel-inner { overflow: hidden; min-height: 0; }
  .details {
    margin: 20px 0 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px 18px;
  }
  .details div {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .details div:last-child { border-bottom: 0; }
  .details dt { color: var(--muted); font-size: 14px; flex-shrink: 0; }
  .details dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
  .details dd.mono { font-family: var(--font-mono); font-size: 13px; }

  .error { margin-top: 16px; color: var(--muted); }
  .error button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .panel, .more-btn svg { transition: none; }
    .skeleton { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p class="label">Alamat IP publik Anda</p>
  <div class="ip-row">
    <h1 class="ip skeleton" id="ip">000.000.000.000</h1>
    <button class="copy" id="copy" type="button" hidden>Salin</button>
  </div>
  <p class="loc skeleton" id="loc">Memuat lokasi</p>
  <div class="error" id="error" hidden></div>

  <button class="more-btn" id="more" type="button" aria-expanded="false" aria-controls="panel" disabled>
    <span id="more-text">Tampilkan lebih banyak</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
  </button>

  <div class="panel" id="panel">
    <div class="panel-inner">
      <dl class="details" id="details"></dl>
    </div>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ipEl = $("ip"), locEl = $("loc"), errEl = $("error");
  var moreBtn = $("more"), moreText = $("more-text"), panel = $("panel"), detailsEl = $("details"), copyBtn = $("copy");

  function parseBrowser() {
    var ua = navigator.userAgent, m;
    var browser = "Tidak diketahui";
    if ((m = ua.match(/Edg\/([\d.]+)/))) browser = "Edge " + m[1].split(".")[0];
    else if ((m = ua.match(/OPR\/([\d.]+)/))) browser = "Opera " + m[1].split(".")[0];
    else if ((m = ua.match(/Firefox\/([\d.]+)/))) browser = "Firefox " + m[1].split(".")[0];
    else if ((m = ua.match(/Chrome\/([\d.]+)/))) browser = "Chrome " + m[1].split(".")[0];
    else if ((m = ua.match(/Version\/([\d.]+).*Safari/))) browser = "Safari " + m[1].split(".")[0];
    var os = "Tidak diketahui";
    if (/Windows/.test(ua)) os = "Windows";
    else if (/Android/.test(ua)) os = "Android";
    else if (/iPhone|iPad|iPod/.test(ua)) os = "iOS";
    else if (/Mac OS X/.test(ua)) os = "macOS";
    else if (/Linux/.test(ua)) os = "Linux";
    return { browser: browser, os: os, ua: ua };
  }

  function offsetLabel(tz) {
    try {
      var parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date());
      var p = parts.filter(function (x) { return x.type === "timeZoneName"; })[0];
      return p ? p.value.replace("GMT", "UTC") : "";
    } catch (e) { return ""; }
  }

  function normalize(d, source) {
    if (source === "ipwho") {
      if (!d.success) throw new Error(d.message || "gagal");
      return {
        ip: d.ip, city: d.city, region: d.region, country: d.country, code: d.country_code,
        zip: d.postal, tz: d.timezone && d.timezone.id, isp: d.connection && (d.connection.isp || d.connection.org),
        lat: d.latitude, lon: d.longitude
      };
    }
    if (d.error) throw new Error(d.reason || "gagal");
    return {
      ip: d.ip, city: d.city, region: d.region, country: d.country_name, code: d.country_code,
      zip: d.postal, tz: d.timezone, isp: d.org, lat: d.latitude, lon: d.longitude
    };
  }

  function lookup() {
    return fetch("https://ipwho.is/").then(function (r) { return r.json(); })
      .then(function (d) { return normalize(d, "ipwho"); })
      .catch(function () {
        return fetch("https://ipapi.co/json/").then(function (r) { return r.json(); })
          .then(function (d) { return normalize(d, "ipapi"); });
      });
  }

  function row(k, v, mono) {
    var div = document.createElement("div");
    var dt = document.createElement("dt"); dt.textContent = k;
    var dd = document.createElement("dd"); dd.textContent = v || "-";
    if (mono) dd.className = "mono";
    div.appendChild(dt); div.appendChild(dd);
    detailsEl.appendChild(div);
  }

  function render(info) {
    ipEl.classList.remove("skeleton");
    ipEl.textContent = info.ip;
    copyBtn.hidden = false;

    locEl.classList.remove("skeleton");
    var place = [info.city, info.country].filter(Boolean).join(", ");
    locEl.textContent = place || "Lokasi tidak tersedia";
    var small = document.createElement("small");
    small.textContent = "Perkiraan berdasarkan alamat IP";
    locEl.appendChild(small);

    var b = parseBrowser();
    var off = info.tz ? offsetLabel(info.tz) : "";
    detailsEl.innerHTML = "";
    row("Wilayah", info.region);
    row("Kode negara", info.code);
    row("Kode pos", info.zip);
    row("Zona waktu", info.tz ? info.tz + (off ? " (" + off + ")" : "") : "");
    row("ISP", info.isp);
    row("Koordinat", (info.lat != null && info.lon != null) ? Number(info.lat).toFixed(4) + ", " + Number(info.lon).toFixed(4) : "", true);
    row("Browser", b.browser);
    row("Sistem operasi", b.os);
    row("Bahasa", navigator.language);
    row("Layar", screen.width + " × " + screen.height + " px");
    row("User agent", b.ua, true);

    moreBtn.disabled = false;
  }

  function fail() {
    ipEl.classList.remove("skeleton");
    ipEl.textContent = "-";
    locEl.hidden = true;
    errEl.hidden = false;
    errEl.innerHTML = "Alamat IP tidak bisa dimuat. Periksa koneksi atau matikan pemblokir iklan, lalu <button type=\"button\" id=\"retry\">coba lagi</button>.";
    $("retry").addEventListener("click", function () { location.reload(); });
  }

  moreBtn.addEventListener("click", function () {
    var open = !panel.classList.contains("open");
    panel.classList.toggle("open", open);
    moreBtn.setAttribute("aria-expanded", String(open));
    moreText.textContent = open ? "Tampilkan lebih sedikit" : "Tampilkan lebih banyak";
    if (open) {
      setTimeout(function () {
        panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "end" });
      }, 200);
    }
  });

  copyBtn.addEventListener("click", function () {
    var text = ipEl.textContent;
    function done() { copyBtn.textContent = "Tersalin"; setTimeout(function () { copyBtn.textContent = "Salin"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { selectIp(); });
    } else { selectIp(); }
  });
  function selectIp() {
    var r = document.createRange(); r.selectNodeContents(ipEl);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  lookup().then(render).catch(fail);
})();
</script>
</body>
</html>
