<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF9F5">
  <title>fork.id — Tools Online Gratis</title>

  <style>
    @font-face {
      font-family: "Galaxie Copernicus";
      src: url("./fonts/GalaxieCopernicus-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --bg: #FAF9F5;
      --text: #171717;
      --muted: #737373;
      --border: #dedbd2;
      --card: #fffefa;
      --shadow: 0 12px 36px rgba(36, 31, 20, .09);
      --font: "Galaxie Copernicus", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    a {
      color: inherit;
    }

    .site-header {
      width: 100%;
      min-height: 76px;
      padding: 14px 5vw;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(23, 23, 23, .07);
    }

    .logo-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .logo-btn img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-in-header img {
      display: block;
      width: auto;
      height: 28px;
      object-fit: contain;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-left: auto;
    }

    .header-menu a {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .header-menu a:hover,
    .header-menu a:focus-visible {
      color: var(--text);
    }

    main {
      width: min(100% - 40px, 680px);
      margin: auto;
      padding: 72px 0 100px;
      text-align: center;
    }

    .intro {
      margin-bottom: 34px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      font-weight: 400;
      letter-spacing: -.045em;
    }

    .intro p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .search-wrap {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      text-align: left;
    }

    .search-input {
      width: 100%;
      height: 58px;
      padding: 0 20px 0 52px;
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font: 400 16px var(--font);
      box-shadow: 0 3px 10px rgba(36, 31, 20, .035);
    }

    .search-input:focus {
      border-color: #8b8578;
      box-shadow: 0 0 0 4px rgba(139, 133, 120, .12);
    }

    .search-icon {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 20px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-list {
      position: absolute;
      z-index: 5;
      top: calc(100% + 10px);
      right: 0;
      left: 0;
      display: none;
      max-height: min(48vh, 380px);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .search-list.open {
      display: block;
    }

    .search-item {
      width: 100%;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 0;
      border-bottom: 1px solid rgba(23, 23, 23, .07);
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .search-item:last-child {
      border-bottom: 0;
    }

    .search-item:hover,
    .search-item[aria-selected="true"] {
      background: rgba(23, 23, 23, .045);
    }

    .tool-title {
      display: block;
      font-size: 15px;
    }

    .tool-description {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .tool-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    .empty-result {
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .site-footer {
      padding: 22px 20px 28px;
      color: var(--muted);
      text-align: center;
    }

    .site-footer p {
      margin: 0;
      font-size: 12px;
    }

    .socials {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .socials a {
      font-size: 12px;
      text-decoration: none;
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--text);
    }

    @media (max-width: 540px) {
      .site-header {
        min-height: 66px;
        padding: 12px 20px;
        gap: 10px;
      }

      .logo-btn {
        width: 38px;
        height: 38px;
      }

      .brand-in-header img {
        height: 23px;
      }

      .header-menu {
        gap: 14px;
      }

      .header-menu a {
        font-size: 12px;
      }

      main {
        padding-top: 56px;
      }

      .intro p {
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .header-menu {
        gap: 10px;
      }

      .header-menu a {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header" id="siteHeader">
    <a class="logo-btn" href="./index.html" aria-label="fork.id — Beranda">
      <img src="./media/logo.png" alt="">
    </a>

    <a class="brand-in-header" href="./index.html" aria-label="fork.id — Beranda">
      <img src="./media/logo.png" alt="FORK.ID">
    </a>

    <nav class="header-menu" aria-label="Navigasi utama">
      <a href="./index.html" aria-current="page">Home</a>
      <a href="#tools">All Tools</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="tools">
    <section class="intro" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Tools, made simple.</h1>
      <p>Temukan alat online yang Anda butuhkan.</p>
    </section>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        id="toolsInput"
        class="search-input"
        type="search"
        placeholder="Cari tools..."
        autocomplete="off"
        role="combobox"
        aria-label="Cari tools"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="toolsList"
      >

      <div
        id="toolsList"
        class="search-list"
        role="listbox"
        aria-label="Hasil pencarian tools"
      ></div>
    </div>
  </main>

  <footer class="site-footer" id="about">
    <p>2026 fork.id</p>
    <div class="socials">
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.inaturalist.org" target="_blank" rel="noopener noreferrer">iNaturalist</a>
    </div>
  </footer>

  <script>
    const TOOLS_JSON_PATH = "./tools.json";
    const TOOLS_CACHE_KEY = "fork-tools-v1";
    const TOOLS_CACHE_TTL = 60 * 60 * 1000;

    const input = document.getElementById("toolsInput");
    const list = document.getElementById("toolsList");

    let tools = [];
    let activeIndex = -1;

    async function loadTools() {
      try {
        const cached = JSON.parse(
          localStorage.getItem(TOOLS_CACHE_KEY) || "null"
        );

        if (
          cached &&
          Array.isArray(cached.data) &&
          Date.now() - cached.savedAt < TOOLS_CACHE_TTL
        ) {
          tools = cached.data;
          return;
        }
      } catch {
        // Cache tidak tersedia atau isinya tidak valid.
      }

      try {
        const response = await fetch(TOOLS_JSON_PATH, { cache: "no-cache" });
        if (!response.ok) throw new Error("Tidak bisa memuat tools.json");

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Format tools.json tidak valid");

        tools = data;
        try {
          localStorage.setItem(
            TOOLS_CACHE_KEY,
            JSON.stringify({ savedAt: Date.now(), data })
          );
        } catch {
          // Pencarian tetap dapat digunakan tanpa localStorage.
        }
      } catch {
        tools = [{
          title: "PDF Tools",
          tags: ["pdf"],
          url: "./pdf-tools.html",
          desc: "Merge, split, compress PDF"
        }];
      }
    }

    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);

      for (let i = 1; i <= a.length; i++) {
        let diagonal = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j++) {
          const above = row[j];
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;

          row[j] = Math.min(
            row[j] + 1,
            row[j - 1] + 1,
            diagonal + cost
          );

          diagonal = above;
        }
      }

      return row[b.length];
    }

    function fuzzyMatch(value, query) {
      const text = String(value || "").toLowerCase();

      if (text.includes(query)) return true;
      if (query.length < 4) return false;

      return text
        .split(/[\s-]+/)
        .some(word => editDistance(word, query) <= 1);
    }

    function getMatches(query) {
      const q = query.trim().toLowerCase();

      if (!q) return tools;

      return tools.filter(tool => {
        const tags = Array.isArray(tool.tags) ? tool.tags : [];

        return (
          fuzzyMatch(tool.title, q) ||
          fuzzyMatch(tool.desc, q) ||
          tags.some(tag => fuzzyMatch(tag, q))
        );
      });
    }

    function render(query = "") {
      const matches = getMatches(query);
      activeIndex = -1;
      list.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty-result";
        empty.textContent = `Tidak ada tools untuk "${query}"`;
        list.appendChild(empty);
        return;
      }

      matches.forEach((tool, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "search-item";
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", "false");
        item.dataset.index = String(index);

        const textWrap = document.createElement("span");

        const title = document.createElement("span");
        title.className = "tool-title";
        title.textContent = tool.title || "Untitled tool";

        const description = document.createElement("span");
        description.className = "tool-description";
        const tags = Array.isArray(tool.tags) ? tool.tags.join(", ") : "";
        description.textContent =
          [tool.desc, tags].filter(Boolean).join(" • ");

        const arrow = document.createElement("span");
        arrow.className = "tool-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";

        textWrap.append(title, description);
        item.append(textWrap, arrow);

        item.addEventListener("click", () => {
          if (tool.url) window.location.href = tool.url;
        });

        list.appendChild(item);
      });
    }

    function openList() {
      list.classList.add("open");
      input.setAttribute("aria-expanded", "true");
    }

    function closeList() {
      list.classList.remove("open");
      input.setAttribute("aria-expanded", "false");
      activeIndex = -1;
    }

    function setActive(index) {
      const items = [...list.querySelectorAll(".search-item")];
      if (!items.length) return;

      activeIndex = (index + items.length) % items.length;

      items.forEach((item, i) => {
        const selected = i === activeIndex;
        item.setAttribute("aria-selected", String(selected));

        if (selected) {
          item.scrollIntoView({ block: "nearest" });
          input.setAttribute("aria-activedescendant", `tool-option-${i}`);
          item.id = `tool-option-${i}`;
        } else {
          item.removeAttribute("id");
        }
      });
    }

    input.addEventListener("focus", () => {
      render(input.value);
      openList();
    });

    input.addEventListener("input", () => {
      render(input.value);
      openList();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        openList();
        setActive(activeIndex + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        openList();
        setActive(activeIndex - 1);
      } else if (event.key === "Enter") {
        const active = list.querySelector('[aria-selected="true"]');
        if (active) {
          event.preventDefault();
          active.click();
        }
      } else if (event.key === "Escape") {
        closeList();
        input.removeAttribute("aria-activedescendant");
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-wrap")) {
        closeList();
        input.removeAttribute("aria-activedescendant");
      }
    });

    loadTools().then(() => {
      if (document.activeElement === input) render(input.value);
    });
  </script>
</body>
</html>
