<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>fork.id - Tools Online Gratis</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --border:#E5E0D5; --border-strong:#111827;
  --text:#111827; --text-2:#6B6B6B;
}
html[data-theme="dark"]{
  --bg:#12100E; --card:#1C1916; --border:#2A241D; --border-strong:#E8E2D5;
  --text:#E8E2D5; --text-2:#9A958B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Galaxie Copernicus","Copernicus","Instrument Serif","EB Garamond",Georgia,serif;
  background:var(--bg); color:var(--text);
  min-height:100dvh; height:100dvh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.home{
  height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:20px; position:relative;
}
.theme{
  position:fixed; top:18px; right:18px; width:40px; height:40px;
  border-radius:999px; border:1px solid var(--border);
  background:var(--card); display:grid; place-items:center; cursor:pointer;
}
.brand-row{display:flex; align-items:center; gap:14px; margin-bottom:32px}
.logo{
  width:80px; height:80px; border-radius:20px; background:var(--card);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
}
.logo img{width:60%; height:60%; object-fit:contain}
#brandImg{height:42px; width:auto}
.search-wrap{position:relative; width:100%; max-width:520px}
.search{
  width:100%; height:52px; border-radius:999px;
  border:1px solid var(--border); background:var(--card);
  padding:0 20px 0 44px; font-size:17px; font-family:inherit;
  outline:none; transition:border .15s;
}
.search:focus{border-color:var(--border-strong)}
.search-wrap::before{
  content:""; position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; background:var(--text);
  -webkit-mask:url('data:image/svg+xml,[STRIPPED]') center/contain no-repeat;
  opacity:.6;
}
.list{
  position:absolute; top:60px; left:0; right:0;
  background:var(--card); border:1px solid var(--border);
  border-radius:16px; max-height:min(48dvh,360px); overflow:auto;
  display:none; box-shadow:0 8px 24px rgba(0,0,0,.06);
}
.list.open{display:block}
.item{padding:12px 16px; display:flex; justify-content:space-between; cursor:pointer; border-bottom:1px solid var(--border)}
.item:hover{background:var(--bg)} .item small{color:var(--text-2); font-size:12px}
footer{position:absolute; bottom:22px; left:0; right:0; text-align:center}
footer p{font-size:11px; color:var(--text-2); font-family:Inter, sans-serif}
.socials{display:flex; gap:14px; justify-content:center; margin-top:8px}
.socials a{color:var(--text-2)} .socials svg{width:16px; height:16px}
@media(max-width:420px){.logo{width:68px;height:68px}#brandImg{height:34px}}
</style>
</head>
<body>
<button class="theme" id="themeBtn" aria-label="theme">◐</button>
<div class="home">
  <div class="brand-row">
    <div class="logo">
      <!-- GANTI DI SINI - PATH LOGO -->
      <img id="logoImg" src="./fork_logo_light.png" alt="logo">
    </div>
    <!-- GANTI DI SINI - PATH BRAND -->
    <img id="brandImg" src="./fork_brand_light.png" alt="FORK.ID">
  </div>
  <div class="search-wrap">
    <input id="q" class="search" placeholder="Tools..." autocomplete="off">
    <div id="list" class="list"></div>
  </div>
  <footer><p>2026 fork.id</p>
    <div class="socials">
      <a href="#">IG</a><a href="#">GH</a><a href="#">iNat</a>
    </div>
  </footer>
</div>

<script>
// GANTI DI SINI - PATH LOGO
const LOGO_SOURCES = {
  light: "./fork_logo_light.png",  // ganti file light
  dark: "./fork_logo_dark.png"     // ganti file dark
};
// GANTI DI SINI - PATH BRAND
const BRAND_SOURCES = {
  light: "./fork_brand_light.png",
  dark: "./fork_brand_dark.png"
};
// GANTI DI SINI - PATH TOOLS.JSON
const TOOLS_PATH = "./tools.json";

let TOOLS=[];
async function load(){ try{ TOOLS=await (await fetch(TOOLS_PATH)).json()}catch{ TOOLS=[
  {title:"PDF Tools", tags:["pdf","document"], url:"./pdf-tools.html", desc:"Merge, split PDF"},
  {title:"Image Compressor", tags:["image"], url:"#", desc:"Kompres gambar"}
]}}
const html=document.documentElement;
function apply(t){
  html.setAttribute("data-theme",t);
  localStorage.setItem("fork-theme",t);
  document.getElementById("logoImg").src=LOGO_SOURCES[t];
  document.getElementById("brandImg").src=BRAND_SOURCES[t];
}
const saved=localStorage.getItem("fork-theme")||"light";
apply(saved);
document.getElementById("themeBtn").onclick=()=>{
  const n=html.getAttribute("data-theme")==="light"?"dark":"light";
  apply(n);
};
const q=document.getElementById("q"), list=document.getElementById("list");
function render(v=""){
  const s=v.toLowerCase().trim();
  const f=!s?TOOLS:TOOLS.filter(t=>t.title.toLowerCase().includes(s)||t.tags.some(x=>x.toLowerCase().includes(s)));
  list.innerHTML=f.map(t=>`<div class="item" data-url="${t.url}"><div><b>${t.title}</b><br><small>${t.desc}</small></div><span>↗</span></div>`).join("")||`<div style="padding:14px;text-align:center"><small>Tidak ada</small></div>`;
}
q.addEventListener("focus",()=>{render(q.value);list.classList.add("open")});
q.addEventListener("input",()=>{render(q.value);list.classList.add("open")});
list.addEventListener("click",e=>{const it=e.target.closest(".item"); if(it) location.href=it.dataset.url});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap")) list.classList.remove("open")});
load().then(()=>render());
</script>
</body>
</html>
