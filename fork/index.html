<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF9F5">
  <title>fork.id — Tools Online Gratis</title>
  <link rel="stylesheet" href="./fork/css/style.css">
</head>

<body>
  <div id="header-placeholder"></div>

  <main id="tools">
    <section class="intro" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Tools, made simple.</h1>
      <p>Temukan alat online yang Anda butuhkan.</p>
    </section>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        id="toolsInput"
        class="search-input"
        type="search"
        placeholder="Cari tools..."
        autocomplete="off"
        role="combobox"
        aria-label="Cari tools"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="toolsList"
      >

      <div
        id="toolsList"
        class="search-list"
        role="listbox"
        aria-label="Hasil pencarian tools"
      ></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="./include-layout.js"></script>
  <script>
    const TOOLS_PATH = "./tools.json";
    const CACHE_KEY = "fork-tools-v1";
    const CACHE_TTL = 60 * 60 * 1000;

    const input = document.getElementById("toolsInput");
    const list = document.getElementById("toolsList");

    let tools = [];
    let activeIndex = -1;

    async function loadTools() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");

        if (
          cached &&
          Array.isArray(cached.data) &&
          Date.now() - cached.savedAt < CACHE_TTL
        ) {
          tools = cached.data;
          return;
        }
      } catch {
        // Cache tidak tersedia atau tidak valid; ambil JSON dari server.
      }

      try {
        const response = await fetch(TOOLS_PATH, { cache: "no-cache" });
        if (!response.ok) throw new Error("Gagal memuat tools.json");

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Format tools.json tidak valid");

        tools = data;

        try {
          localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({ savedAt: Date.now(), data })
          );
        } catch {
          // Pencarian tetap berjalan jika localStorage tidak tersedia.
        }
      } catch (error) {
        console.error(error);
        tools = [];
      }
    }

    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);

      for (let i = 1; i <= a.length; i++) {
        let diagonal = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j++) {
          const above = row[j];
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;

          row[j] = Math.min(
            row[j] + 1,
            row[j - 1] + 1,
            diagonal + cost
          );
          diagonal = above;
        }
      }

      return row[b.length];
    }

    function fuzzyMatch(value, query) {
      const text = String(value || "").toLowerCase();

      if (text.includes(query)) return true;
      if (query.length < 4) return false;

      return text
        .split(/[\s-]+/)
        .some(word => editDistance(word, query) <= 1);
    }

    function getMatches(query) {
      const q = query.trim().toLowerCase();
      if (!q) return tools;

      return tools.filter(tool => {
        const tags = Array.isArray(tool.tags) ? tool.tags : [];

        return (
          fuzzyMatch(tool.title, q) ||
          fuzzyMatch(tool.desc, q) ||
          tags.some(tag => fuzzyMatch(tag, q))
        );
      });
    }

    function render(query = "") {
      const matches = getMatches(query);
      activeIndex = -1;
      list.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty-result";
        empty.textContent = `Tidak ada tools untuk "${query}"`;
        list.appendChild(empty);
        return;
      }

      matches.forEach((tool, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "search-item";
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", "false");

        const details = document.createElement("span");

        const title = document.createElement("span");
        title.className = "tool-title";
        title.textContent = tool.title || "Untitled tool";

        const description = document.createElement("span");
        description.className = "tool-description";
        const tags = Array.isArray(tool.tags) ? tool.tags.join(", ") : "";
        description.textContent = [tool.desc, tags].filter(Boolean).join(" • ");

        const arrow = document.createElement("span");
        arrow.className = "tool-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";

        details.append(title, description);
        item.append(details, arrow);

        item.addEventListener("click", () => {
          if (tool.url) window.location.href = tool.url;
        });

        list.appendChild(item);
      });
    }

    function openList() {
      list.classList.add("open");
      input.setAttribute("aria-expanded", "true");
    }

    function closeList() {
      list.classList.remove("open");
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      activeIndex = -1;
    }

    function setActive(index) {
      const items = [...list.querySelectorAll(".search-item")];
      if (!items.length) return;

      activeIndex = (index + items.length) % items.length;

      items.forEach((item, i) => {
        const selected = i === activeIndex;
        item.setAttribute("aria-selected", String(selected));

        if (selected) {
          item.id = `tool-option-${i}`;
          input.setAttribute("aria-activedescendant", item.id);
          item.scrollIntoView({ block: "nearest" });
        } else {
          item.removeAttribute("id");
        }
      });
    }

    input.addEventListener("focus", () => {
      render(input.value);
      openList();
    });

    input.addEventListener("input", () => {
      render(input.value);
      openList();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        openList();
        setActive(activeIndex + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        openList();
        setActive(activeIndex - 1);
      } else if (event.key === "Enter") {
        const selected = list.querySelector('[aria-selected="true"]');
        if (selected) {
          event.preventDefault();
          selected.click();
        }
      } else if (event.key === "Escape") {
        closeList();
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-wrap")) closeList();
    });

    loadTools().then(() => {
      if (document.activeElement === input) render(input.value);
    });
  </script>
</body>
</html>
